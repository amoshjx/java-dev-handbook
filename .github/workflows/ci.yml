name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check HTML internal links
        run: node scripts/check-html-links.js

      - name: Check Mermaid diagram blocks
        run: node scripts/check-mermaid-diagrams.js
